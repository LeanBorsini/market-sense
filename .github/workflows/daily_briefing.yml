name: MarketSense Autonomous Telegram Cron 24/7

on:
  schedule:
    # 07:00 UTC = 09:00 CET / 08:00 Dublín (Apertura Europa & Madrid BME)
    - cron: '0 7 * * 1-5'
    # 13:30 UTC = 15:30 CET / 09:30 Nueva York (Apertura Wall Street)
    - cron: '30 13 * * 1-5'
    # 18:00 UTC = 20:00 CET / 14:00 Nueva York (Ventana FED / Powell / Tipos)
    - cron: '0 18 * * 1-5'
    # 20:00 UTC = 22:00 CET / 16:00 Nueva York (Cierre Wall St & Resumen Diario)
    - cron: '0 20 * * 1-5'
  workflow_dispatch: # Permite pulsar "Run workflow" manualmente en GitHub cuando quieras

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Despachar a Telegram por separado
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '-1004499299168' }}
        run: node scripts/telegram_cron_briefing.js
